<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064a83"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PharmaFlow">
<title>PharmaFlow</title>
<link rel="apple-touch-icon" sizes="180x180" href="./pharmaflow-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./pharmaflow-icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:#042d64}body{margin:0;min-height:100svh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;isolation:isolate;background:radial-gradient(ellipse 75% 40% at 3% 1%,rgba(33,240,247,.78),transparent 72%),radial-gradient(ellipse 85% 60% at 95% 58%,rgba(0,160,233,.44),transparent 74%),radial-gradient(ellipse 80% 50% at 30% 85%,rgba(0,105,214,.54),transparent 80%),linear-gradient(145deg,#075eac 0%,#06427e 33%,#031a4a 65%,#032657 100%);text-align:center}
body:before,body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body:before{background:radial-gradient(ellipse 105% 25% at 100% 33%,rgba(31,224,246,.30),transparent 72%),radial-gradient(ellipse 100% 30% at 0 70%,rgba(19,205,255,.3),transparent 75%);clip-path:polygon(0 20%,100% 0,100% 100%,0 90%)}
body:after{background:linear-gradient(125deg,transparent 30%,rgba(68,241,255,.13) 45%,transparent 58%);transform:skewY(-14deg)}
main{width:min(82vw,550px);padding:clamp(32px,6vh,64px) clamp(18px,5vw,52px);margin:24px auto 110px;border-radius:clamp(34px,7vw,62px);background:linear-gradient(145deg,rgba(80,216,250,.23),rgba(12,85,161,.25) 55%,rgba(22,185,237,.18));border:1px solid rgba(161,246,255,.72);box-shadow:inset 0 0 32px rgba(102,235,255,.20),0 0 32px rgba(35,211,255,.18),0 20px 55px rgba(0,15,50,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{width:clamp(128px,28vw,206px);height:auto;aspect-ratio:1;border-radius:24%;filter:drop-shadow(0 7px 15px rgba(0,13,56,.4))}
h1{font-size:clamp(34px,7vw,56px);letter-spacing:-1.6px;margin:17px 0 2px;font-weight:800;text-shadow:0 2px 8px rgba(0,15,46,.25)}
.subtitle{font-size:clamp(19px,3.7vw,29px);color:#d7eaf9;margin:8px 0 30px}
.open{display:block;width:100%;max-width:390px;margin:0 auto;padding:17px 16px;border-radius:28px;background:linear-gradient(110deg,#38efdd,#54e4db);border:1px solid #b8fff9;box-shadow:0 0 22px rgba(44,247,232,.28),inset 0 2px 0 rgba(255,255,255,.33);color:#002c54;font-size:clamp(19px,4vw,27px);font-weight:800;text-decoration:none;transition:transform .15s}
.open:active{transform:scale(.98)}.open:focus-visible{outline:3px solid #fff;outline-offset:4px}
footer{position:absolute;bottom:0;left:0;right:0;padding:18px 10px max(24px,env(safe-area-inset-bottom));color:#e0eefa;font-size:clamp(10px,1.9vw,13px);line-height:1.7;text-align:center;background:transparent}
footer .copyright{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}footer .year{color:#47e7f1;font-weight:700}footer .version{border:1px solid rgba(202,235,255,.35);border-radius:99px;padding:0 12px;white-space:nowrap;font-size:11px}footer .credit{font-size:clamp(10px,1.8vw,12px);letter-spacing:.15px;color:#c1dcf0}
@media(max-height:720px){main{margin-top:12px;margin-bottom:110px;padding-top:20px;padding-bottom:24px}.logo{width:110px}.subtitle{margin-bottom:17px}}
@media(max-height:520px){body{justify-content:flex-start}main{margin-bottom:25px}footer{position:static;margin-top:auto}}
@media(prefers-reduced-motion:reduce){.open{transition:none}}
.branch{margin:14px auto 0;max-width:390px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(14px,3.2vw,17px);color:#d7eaf9}
.branch input{width:120px;padding:9px 10px;border-radius:14px;border:1px solid rgba(161,246,255,.7);background:rgba(0,30,70,.35);color:#fff;font:inherit;text-align:center}
.branch button{border:0;background:none;color:#47e7f1;font:inherit;font-weight:700;cursor:pointer;padding:8px 4px;text-decoration:underline}
</style></head>
<body><main><img class="logo" src="./pharmaflow-icon-512.png" alt="PharmaFlow PF"><h1>PharmaFlow</h1><p class="subtitle">بوابة الصيدليات</p><a class="open" href="https://script.google.com/a/al-dawaa.com.sa/macros/s/AKfycbyKt6LKHXfzdvJyXFZ7en4c9NxR4-HowD5ijzvpF62GEu6s5wSSFHGrPdOnLQfBej3FSQ/exec" id="open-app">فتح التطبيق &#8250;</a><div class="branch" id="branch-box"></div></main>
<footer lang="en" dir="ltr"><div class="copyright"><span>© <span class="year" id="year"></span> PharmaFlow. All Rights Reserved.</span><span class="version" id="version" hidden></span></div><div class="credit">Designed &amp; Developed by Dr. Ahmed Salah</div></footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
fetch('./version.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(d=>{if(typeof d.version==='string'&&/^\d+\.\d+\.\d+$/.test(d.version)){const el=document.getElementById('version');el.textContent='v'+d.version;el.hidden=false}}).catch(()=>{});

/* The branch is remembered here (first-party, persistent) and passed to the portal as ?b=. */
(function(){
  var KEY='pf_launcher_branch_v1',a=document.getElementById('open-app'),box=document.getElementById('branch-box'),base=a.getAttribute('href');
  function get(){try{return (localStorage.getItem(KEY)||'').replace(/[^0-9]/g,'');}catch(e){return '';}}
  function set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY);}catch(e){}}
  function draw(edit){
    var b=get();a.href=b?base+'?b='+encodeURIComponent(b):base;
    if(b&&!edit){box.innerHTML='<span>فرعي: <b>'+b+'</b></span><button type="button">تغيير</button>';box.querySelector('button').onclick=function(){draw(true);};return;}
    box.innerHTML='<input inputmode="numeric" maxlength="6" placeholder="رقم الفرع" value="'+b+'" aria-label="رقم الفرع"><button type="button">حفظ</button>';
    var i=box.querySelector('input');box.querySelector('button').onclick=function(){var v=i.value.replace(/[^0-9]/g,'');if(/^\d{3,6}$/.test(v)){set(v);draw(false);}else i.focus();};
    i.onkeydown=function(e){if(e.key==='Enter')box.querySelector('button').click();};
  }
  draw(false);
})();
</script></body></html>
